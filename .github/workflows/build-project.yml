name: Build PhD

on:
  push:
    branches:
      - main
    paths:
      - '**/*.lean'
      - 'lean-toolchain'
      - 'lakefile.toml'
      - 'lake-manifest.json'
  pull_request:
    branches:
      - main
    paths:
      - '**/*.lean'
      - 'lean-toolchain'
      - 'lakefile.toml'
      - 'lake-manifest.json'
  workflow_dispatch: # Allow manual triggering of the workflow from the GitHub Actions interface

# Cancel previous runs if a new commit is pushed to the same PR or branch
concurrency:
  group: ${{ github.ref }}  # Group runs by the ref (branch or PR)
  cancel-in-progress: true  # Cancel any ongoing runs in the same group

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages and modify PR labels
permissions:
  contents: read          # Read access to repository contents
  pages: write            # Write access to GitHub Pages
  id-token: write         # Write access to ID tokens

jobs:
  build_project:
    runs-on: ubuntu-latest
    name: Build project
    steps:
      - name: Checkout project
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Fetch all history for all branches and tags

      - name: Install elan
        run: curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y

      - name: Get Mathlib cache
        run: ~/.elan/bin/lake exe cache get || true

      - name: Cache build artifacts
        uses: actions/cache@v5
        with:
          path: |
            .lake/build
          key: LakeBuild-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}
          restore-keys: LakeBuild-

      - name: Check the Main and TauCeti chains stay separate
        run: |
          rc=0
          if [ -d PhD/TauCeti ] && grep -rn '^import PhD\.Main\.' PhD/TauCeti --include='*.lean'; then
            echo "::error::PhD/TauCeti must not import PhD.Main.* — the restated chain is self-contained."
            rc=1
          fi
          if [ -d PhD/Main ] && grep -rn '^import PhD\.TauCeti\.' PhD/Main --include='*.lean'; then
            echo "::error::PhD/Main must not import PhD.TauCeti.* — that would pull the restated chain into the main build."
            rc=1
          fi
          exit $rc

      - name: Build project
        run: ~/.elan/bin/lake build PhD

      - name: Build the TauCeti chain
        run: ~/.elan/bin/lake build PhD.TauCeti
